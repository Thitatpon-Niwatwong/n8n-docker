version: '3.9'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
      - N8N_LOG_OUTPUT=console
      - TZ=Asia/Bangkok
    volumes:
      - n8n_data:/home/node/.n8n
      - C:/Users/thita/n8n-files:/files
    restart: always
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: customuser
      POSTGRES_PASSWORD: custompass
      POSTGRES_DB: customdb
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - C:/Users/thita/docker/postgres/data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      TZ: Asia/Bangkok
    ports:
      - "5050:80"
    volumes:
      - C:/Users/thita/docker/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - C:/Users/thita/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - C:/Users/thita/docker/grafana:/var/lib/grafana
    environment:
      - TZ=Asia/Bangkok
    restart: always

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - C:/Users/thita/docker/loki/config.yml:/etc/loki/config.yml
      - C:/Users/thita/docker/loki/data:/loki
    restart: always

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - C:/Users/thita/docker/promtail:/etc/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    restart: always
    depends_on:
      - loki

volumes:
  n8n_data:
    external: true
